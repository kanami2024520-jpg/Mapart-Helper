dependencies {
    // GTNH libraries available in the target pack (2.8.4 / 2.9.0-RC-2).
    // GTNHExtLib is a large runtime-only helper; the pack provides it, and pulling it
    // through CI has been unreliable, so keep it out of the compile classpath.
    implementation("com.github.GTNewHorizons:GTNHLib:0.11.52:dev") {
        exclude group: "com.github.GTNewHorizons", module: "GTNHExtLib"
    }
    implementation("com.github.GTNewHorizons:ModularUI2:2.3.92-1.7.10:dev") {
        exclude group: "com.github.GTNewHorizons", module: "GTNHExtLib"
    }
}
